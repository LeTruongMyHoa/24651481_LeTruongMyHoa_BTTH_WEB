<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Classic Movie Day</title>
    <style>
        table {
            border-collapse: separate; 
            border-spacing: 2px;
            border: 1px solid #888;
            width: 100%;
            max-width: 700px;
            font-family: "Times New Roman", Times, serif;
            margin: 20px auto;
        }
        
        th, td {
            border: 1px solid #888;
            padding: 8px;
        }

        .table-title {
            text-align: center;
            font-size: 1.2em;
        }

        th {
            text-align: center;
            font-weight: bold;
        }

        td {
            text-align: left;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td colspan="5" class="table-title">Classic Movie Day</td>
        </tr>
        
        <tr>
            <th></th>
            <th>5 pm</th>
            <th>7 pm</th>
            <th>9 pm</th>
            <th>11 pm</th>
        </tr>
        
        <tr>
            <th>Screen<br>one</th>
            <td>Star Wars</td>
            <td>Empire Strikes<br>Back</td>
            <td>Return of the Jedi</td>
            <td>The Exorcist</td>
        </tr>
        
        <tr>
            <th>Screen<br>two</th>
            <td colspan="2">Dances with Wolves</td>
            <td colspan="2">Gone With the Wind</td>
        </tr>
        
        <tr>
            <th>Screen<br>three</th>
            <td colspan="2">2001: A Space Odyssey</td>
            <td>The Conversation</td>
            <td>5 Easy Pieces</td>
        </tr>
    </table>

</body>
</html>
